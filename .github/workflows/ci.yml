name: Verify offline SRE platform
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package with verification tools
        run: python -m pip install '.[dev]'
      - name: Lint, source security scan, compile and test
        run: |
          ruff check .
          bandit -q -r src
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Exercise installed CLI
        run: sre-platform --db "${RUNNER_TEMP}/incidents.db" demo
