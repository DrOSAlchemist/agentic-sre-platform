[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sre-platform"
version = "0.1.0"
description = "Local-first, evidence-backed SRE investigation with bounded remediation proposals"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.14", "bandit==1.8.6"]

[project.scripts]
sre-platform = "sre_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
